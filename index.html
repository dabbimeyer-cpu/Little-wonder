function vEdit(){const p=preg(todayKey());
return `<div class="cd"><div class="hd">Estimated due date</div><input type="date" data-ch="due" value="${S.due}"><div class="mu" id="lw-duep" style="margin-top:6px">${dueLine(p)}</div></div>
<div class="cd"><div class="hd">Daily rituals</div>${S.habits.map(h=>`<div class="row" style="margin-bottom:8px"><input type="text" data-ch="hname" data-id="${esc(h.id)}" value="${esc(h.name)}" maxlength="40" aria-label="Ritual name"><button data-act="hdel" data-id="${esc(h.id)}" style="padding:0 12px" aria-label="Remove ritual">${ti('trash',18)}</button></div>`).join('')}
<div class="row"><input type="text" id="lw-hnew" maxlength="40" placeholder="Evening stretch"><button class="pr" data-act="hadd" style="flex:none">Add</button></div><div id="lw-herr" style="font-size:13px;color:#a8503f"></div><div class="mu" style="margin-top:6px">Tracking labels only. Past ticks stay with each date.</div></div>
<div class="cd"><div class="hd">Water</div><div class="g2"><div><label class="mu">Glasses per day</label><input type="number" data-ch="goal" min="1" max="20" step="1" inputmode="numeric" value="${S.goal}"></div><div><label class="mu">mL per glass</label><input type="number" data-ch="ml" min="50" max="1000" step="10" inputmode="numeric" value="${S.ml}"></div></div></div>
<div class="cd"><div class="hd">Backup</div><button data-act="export" style="width:100%">Create backup</button><div id="lw-exp"></div>
<div class="mu" style="margin:12px 0 4px">Restore from a backup</div><textarea id="lw-imp" style="min-height:70px;font-size:13px" placeholder="Paste backup text"></textarea><div id="lw-ierr" style="font-size:13px;color:#a8503f"></div><button data-act="import" id="lw-ib" style="width:100%;margin-top:8px">Restore</button>
<div class="mu" style="margin-top:10px">Your journal lives only in this browser on this device. Nothing is uploaded. Clearing browser data removes it, so keep a backup.${durable?'':' This browser is not saving between visits.'}</div></div>
<div class="mu" style="text-align:center;margin-top:12px;font-size:12px">Scripture from the Holy Bible, New Living Translation © Tyndale House Foundation · Little Wonder v3.0</div>`}
function render(){drawNav();main.innerHTML={today:vToday,growth:vGrowth,weight:vWeight,birth:vBirth,edit:vEdit}[tab]();if(tab==='birth')modeBtns()}
function setW(n){n=Math.max(0,Math.min(40,n));if(n)S.water[sel]=n;else delete S.water[sel];save();render()}
const ACT={
tab(id){if(breath.on)stopBreath();tab=id;delArm=null;impArm=false;render();window.scrollTo(0,0)},
day(id){sel=addDays(sel,+id);render()},now(){sel=todayKey();render()},
chk(id){const c=S.checks[sel]||(S.checks[sel]={});if(c[id])delete c[id];else c[id]=true;if(!Object.keys(c).length)delete S.checks[sel];save();render()},
drop(id){const n=+id,cur=S.water[sel]||0;setW(cur===n?n-1:n)},wplus(){setW((S.water[sel]||0)+1)},wminus(){setW((S.water[sel]||0)-1)},
wsave(){const d=root.querySelector('#lw-wd').value,k=parseFloat(String(root.querySelector('#lw-wk').value).replace(',','.')),er=root.querySelector('#lw-werr');
if(!isKey(d)){er.textContent='Choose a date first.';return}if(!(k>=20&&k<=300)){er.textContent='Enter a weight in kilograms, such as 64.5.';return}
S.weights=S.weights.filter(x=>x.date!==d);S.weights.push({date:d,kg:Math.round(k*10)/10});S.weights.sort((a,b)=>utc(a.date)-utc(b.date));save();wForm={d:null,k:''};delArm=null;render();toast('Entry saved')},
wedit(id){const x=S.weights.find(w=>w.date===id);if(!x)return;wForm={d:id,k:String(x.kg)};delArm=null;render();toast('Change the number, then save')},
wdel(id){if(delArm!==id){delArm=id;render();return}S.weights=S.weights.filter(x=>x.date!==id);delArm=null;save();render();toast('Entry removed')},
aff(){affOff++;root.querySelector('#lw-aff').innerHTML=affHtml()},
fav(id){const i=S.favs.indexOf(id);if(i>=0)S.favs.splice(i,1);else S.favs.push(id);save();root.querySelector('#lw-aff').innerHTML=affHtml();root.querySelector('#lw-favs').innerHTML=favHtml()},
unfav(id){S.favs.splice(+id,1);save();root.querySelector('#lw-aff').innerHTML=affHtml();root.querySelector('#lw-favs').innerHTML=favHtml()},
breath(){if(breath.on){stopBreath();return}breath.on=true;root.querySelector('#lw-bb').textContent='Pause';breathStep(true)},
bmode(id){breath.mode=+id;modeBtns();if(breath.on){clearTimeout(breath.timer);breathStep(true)}},
wave(){if(waveStart){S.waves.push({s:waveStart,e:Date.now()});S.waves=S.waves.slice(-30);waveStart=null;save()}else waveStart=Date.now();root.querySelector('#lw-wave').innerHTML=waveHtml()},
wclear(){S.waves=[];save();root.querySelector('#lw-wave').innerHTML=waveHtml()},
hadd(){const i=root.querySelector('#lw-hnew'),v=i.value.trim();if(!v){root.querySelector('#lw-herr').textContent='Type a ritual name first.';return}S.habits.push({id:'h'+Date.now().toString(36),name:v});save();render()},
hdel(id){S.habits=S.habits.filter(h=>h.id!==id);save();render()},
export(){root.querySelector('#lw-exp').innerHTML='<textarea id="lw-ex" readonly style="min-height:90px;font-size:13px;margin-top:8px"></textarea><button data-act="copy" style="width:100%;margin-top:8px">'+ti('copy',18)+' Copy backup</button>';root.querySelector('#lw-ex').value=JSON.stringify(S)},
copy(){const t=root.querySelector('#lw-ex');if(!t)return;t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Backup copied'),()=>toast(ok?'Backup copied':'Select the text and copy it'));else toast(ok?'Backup copied':'Select the text and copy it')},
import(){const er=root.querySelector('#lw-ierr'),b=root.querySelector('#lw-ib');let d;try{d=JSON.parse(root.querySelector('#lw-imp').value)}catch(e){d=null}
if(!d||typeof d!=='object'||Array.isArray(d)){er.textContent='That doesn’t look like a Little Wonder backup. Paste the full text.';impArm=false;b.textContent='Restore';return}
if(!impArm){impArm=true;er.textContent='';b.textContent='Replace current journal with this backup';return}impArm=false;S=norm(d);save();sel=todayKey();render();toast('Journal restored')}};
root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!root.contains(b))return;const f=ACT[b.dataset.act];if(f)f(b.dataset.id)});
root.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.in;
if(k==='note'){if(t.value)S.notes[sel]=t.value;else delete S.notes[sel];save()}else if(k==='wishes'){S.wishes=t.value;save()}
if(t.id==='lw-wd'||t.id==='lw-wk'){const er=root.querySelector('#lw-werr');if(er)er.textContent=''}
if(t.id==='lw-hnew'){const er=root.querySelector('#lw-herr');if(er)er.textContent=''}
if(t.id==='lw-imp'){impArm=false;const er=root.querySelector('#lw-ierr'),b=root.querySelector('#lw-ib');if(er)er.textContent='';if(b)b.textContent='Restore'}});
root.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.ch;if(!k)return;
if(k==='due'){if(isKey(t.value)){S.due=t.value;save();const l=root.querySelector('#lw-duep');if(l)l.textContent=dueLine(preg(todayKey()));toast('Due date updated')}else t.value=S.due}
else if(k==='hname'){const h=S.habits.find(x=>x.id===t.dataset.id);if(h){const v=t.value.trim();if(v){h.name=v;save()}else t.value=h.name}}
else if(k==='goal'){S.goal=clamp(t.value,1,20,S.goal);t.value=S.goal;save()}
else if(k==='ml'){S.ml=clamp(t.value,50,1000,S.ml);t.value=S.ml;save()}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lw-hnew'){e.preventDefault();ACT.hadd()}});
setInterval(()=>{if(!waveStart)return;const el=root.querySelector('#lw-wt');if(el)el.textContent=durTxt(Date.now()-waveStart)},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='today'&&!root.querySelector('textarea:focus'))render()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
